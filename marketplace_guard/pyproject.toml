[project]
name = "marketplace_guard"
description = "Access control for third-party marketplace and accounting apps bundled with this ERPNext fork"
authors = [
    { name = "Marketplace Guard contributors" }
]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GNU General Public License (v3)" }
dynamic = ["version"]

dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
erpnext = ">=17.0.0-dev,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
